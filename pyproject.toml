[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lavesecexpress_etl"
version = "1.0.0"
description = "ETL de uma lavanderia de autoatendimento: consolida o sistema de gestão da lavanderia e os bancos parceiros em PostgreSQL nas camadas RAW/SILVER/RULES/GOLD."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Renan Nogueira" }
]

dependencies = [
    "pandas>=2.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "selenium>=4.20",
    "undetected-chromedriver>=3.5",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
