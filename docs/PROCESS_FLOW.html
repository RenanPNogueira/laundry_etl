<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETL · Lav &amp; Sec Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f3f4f7; --dot:#dde1e9;
    --ink:#242b37; --muted:#697384;
    --card:#ffffff; --card-bd:#e3e7ee; --card-sh:0 4px 16px rgba(28,39,60,.07);
    --wire:#9aa4b4; --wire-lbl:#4b5568;
    --proc-ac:#586579;
    --start:#0e9f6e; --start-bg:#e6f6ef;
    --end:#bd8410; --end-bg:#fbf1d8;
    --dec-bd:#dda224; --dec-fill:#fff8e6; --dec-ink:#8a5900;
    --act-bd:#2f6fed; --act-bg:#eaf1fe; --act-ink:#1c47a0;
    --mode-bd:#7c53e0; --mode-bg:#f2ecfd; --mode-ink:#5a34ad;
    --stop-bd:#df4438; --stop-bg:#fdeae7; --stop-ink:#a1281e;
    --disp:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);color:var(--ink);background:#eef0f4;overflow:hidden}

  .bar{height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;
    background:#fff;border-bottom:1px solid var(--card-bd);position:relative;z-index:40}
  .brand{display:flex;flex-direction:column;line-height:1.15;flex:none}
  .brand .t{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .s{font-size:11.5px;color:var(--muted)}
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{font-size:13px;font-weight:500;color:var(--muted);padding:8px 13px;border-radius:9px;
    background:transparent;border:1px solid transparent;cursor:default;white-space:nowrap}
  .tab.active{color:var(--ink);background:var(--canvas);border-color:var(--card-bd);font-weight:600}
  .tab.soon{opacity:.55}
  .tab.soon::after{content:"em breve";font-size:9.5px;margin-left:7px;background:#eef0f4;color:var(--muted);
    padding:2px 6px;border-radius:6px;vertical-align:middle;letter-spacing:.02em}
  body.en .tab.soon::after{content:"soon"}
  .bar .spacer{flex:1}
  .hint{font-size:12px;color:var(--muted);white-space:nowrap}
  .hint b{color:var(--ink);font-weight:600}
  @media (max-width:1080px){ .hint{display:none} }
  @media (max-width:920px){ .tabs .soon{display:none} .brand .s{display:none} }

  .langsw{display:flex;gap:6px;flex:none}
  .flag{width:32px;height:23px;padding:0;border:1px solid var(--card-bd);border-radius:6px;overflow:hidden;
    cursor:pointer;background:#fff;opacity:.42;transition:opacity .15s, box-shadow .15s, transform .1s}
  .flag:hover{opacity:.8}
  .flag.active{opacity:1;box-shadow:0 0 0 2px rgba(47,111,237,.35)}
  .flag:active{transform:scale(.94)}
  .flag svg{display:block;width:100%;height:100%}

  #canvas{position:absolute;inset:60px 0 0 0;overflow:hidden;cursor:grab;
    background-color:var(--canvas);
    background-image:radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size:26px 26px}
  #canvas.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0}
  #wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .wpath{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linecap:round}
  .wpath.stop{stroke:var(--stop-bd);stroke-dasharray:6 6}

  .node{position:absolute;user-select:none;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:var(--card-sh);transition:transform .16s ease, box-shadow .16s ease}
  .node:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(28,39,60,.15);z-index:6}
  .node.active{box-shadow:0 0 0 3px rgba(47,111,237,.35), 0 10px 26px rgba(28,39,60,.16)}
  .node .ttl{font-family:var(--disp);font-weight:600;font-size:14.5px;line-height:1.22}
  .node .sub{font-size:11.8px;color:var(--muted);margin-top:5px;line-height:1.35}

  .n-proc{background:var(--card);border:1px solid var(--card-bd);border-left:4px solid var(--proc-ac);
    border-radius:12px;padding:14px 16px}
  .n-term{border-radius:999px;padding:0 22px;align-items:center;text-align:center}
  .n-term .ttl{font-family:var(--disp);font-weight:700;font-size:15px}
  .n-start{background:var(--start-bg);border:1.5px solid var(--start)} .n-start .ttl{color:var(--start)}
  .n-end{background:var(--end-bg);border:1.5px solid var(--end)} .n-end .ttl{color:var(--end);font-size:14px}
  .n-act{border-radius:12px;padding:13px 16px;background:var(--act-bg);border:1px solid var(--act-bd)}
  .n-act .ttl{color:var(--act-ink)}
  .n-mode{border-radius:12px;padding:13px 16px;background:var(--mode-bg);border:1px solid var(--mode-bd)}
  .n-mode .ttl{color:var(--mode-ink)}
  .n-stop{border-radius:12px;padding:13px 16px;background:var(--stop-bg);border:1px solid var(--stop-bd)}
  .n-stop .ttl{color:var(--stop-ink)} .n-stop .sub{color:#b05149}

  .node .plus{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
    background:#fff;border:1px solid var(--card-bd);color:var(--muted);font-size:13px;line-height:18px;
    text-align:center;box-shadow:0 2px 5px rgba(28,39,60,.12);opacity:0;transition:opacity .16s}
  .node:hover .plus,.node.active .plus{opacity:1}

  .n-dec{background:var(--dec-bd);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:none;padding:0}
  .n-dec .inner{position:absolute;inset:2px;background:var(--dec-fill);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:0 46px}
  .n-dec .ttl{font-size:13.5px;color:var(--dec-ink)}
  .n-dec .eye{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.16em;color:var(--dec-bd);font-weight:700;text-transform:uppercase}
  .n-dec.active .inner{background:#fff3cf}
  .n-dec .diamark{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--dec-bd);opacity:0;transition:opacity .16s}
  .n-dec:hover .diamark,.n-dec.active .diamark{opacity:1}

  .elbl{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--card-bd);
    color:var(--wire-lbl);font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
    box-shadow:0 1px 3px rgba(28,39,60,.08);white-space:nowrap;pointer-events:none}
  .elbl.yes{color:#0e7a53;border-color:#bfe6d5}
  .elbl.no{color:#b23a2f;border-color:#f3cdc8}

  .node{opacity:0;animation:pop .5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  #wires .wpath{opacity:0;animation:fade .6s ease forwards}
  .elbl{opacity:0;animation:fade .5s ease forwards}
  @keyframes fade{to{opacity:1}}

  .controls{position:absolute;right:20px;bottom:20px;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .zoombox{display:flex;align-items:center;background:#fff;border:1px solid var(--card-bd);border-radius:12px;
    box-shadow:var(--card-sh);overflow:hidden}
  .zoombox button{border:none;background:#fff;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink)}
  .zoombox button:hover{background:var(--canvas)}
  .zoombox .pct{width:52px;text-align:center;font-size:12px;color:var(--muted);
    border-left:1px solid var(--card-bd);border-right:1px solid var(--card-bd);height:38px;line-height:38px}
  .fitbtn{background:#fff;border:1px solid var(--card-bd);border-radius:10px;padding:9px 14px;font-size:12.5px;
    font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--card-sh)}
  .fitbtn:hover{background:var(--canvas)}

  .legend{position:absolute;left:20px;bottom:20px;z-index:30;background:#fff;border:1px solid var(--card-bd);
    border-radius:12px;box-shadow:var(--card-sh);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
  .legend .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .legend .sw{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.06)}
  .legend .sw.dia{border-radius:2px;transform:rotate(45deg);width:11px;height:11px}
  @media (max-width:760px){ .legend{display:none} }

  #drawer{position:absolute;top:60px;right:0;bottom:0;width:400px;max-width:88vw;background:#fff;
    border-left:1px solid var(--card-bd);box-shadow:-14px 0 40px rgba(28,39,60,.12);z-index:35;
    transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.3,1);
    display:flex;flex-direction:column}
  #drawer.open{transform:none}
  .dw-head{padding:22px 24px 16px;border-bottom:1px solid var(--card-bd);position:relative}
  .dw-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;margin-bottom:12px}
  .dw-title{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.2;margin:0;padding-right:34px}
  .dw-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:9px;border:1px solid var(--card-bd);
    background:#fff;cursor:pointer;font-size:17px;color:var(--muted);line-height:30px}
  .dw-close:hover{background:var(--canvas);color:var(--ink)}
  .dw-body{padding:20px 24px 40px;overflow-y:auto}
  .dw-lead{font-size:14px;color:var(--ink);line-height:1.55;margin:0 0 18px}
  .dw-sec{margin-bottom:18px}
  .dw-sec h4{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--muted);
    text-transform:uppercase;margin:0 0 9px}
  .dw-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .dw-sec li{font-size:13.3px;line-height:1.45;padding-left:16px;position:relative;color:#3a4353}
  .dw-sec li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:var(--proc-ac)}
  .dw-sec li b{color:var(--ink);font-weight:600}
  .dw-sec code{font-family:var(--mono);font-size:11.6px;background:#f1f3f7;border:1px solid #e4e8ee;
    border-radius:5px;padding:1px 6px;color:#334}
  .dw-note{font-size:12.5px;line-height:1.45;background:var(--stop-bg);border:1px solid #f3cdc8;color:#8f342b;
    border-radius:10px;padding:11px 13px;margin-top:4px}
  .dw-note b{color:#7a2820}

  @media (prefers-reduced-motion:reduce){
    .node,.elbl,#wires .wpath{animation:none;opacity:1}
    .node{transform:none}
    #drawer{transition:none}
  }
</style>
</head>
<body>

  <div class="bar">
    <div class="brand">
      <span class="t">ETL · Lav &amp; Sec Express</span>
      <span class="s" id="uiSub">Documentação do processo</span>
    </div>
    <div class="tabs" id="uiTabs">
      <div class="tab active"><span></span></div>
      <div class="tab soon"><span></span></div>
      <div class="tab soon"><span></span></div>
      <div class="tab soon"><span></span></div>
    </div>
    <div class="spacer"></div>
    <div class="hint" id="uiHint"></div>
    <div class="langsw">
      <button class="flag active" data-lang="pt" title="Português (Brasil)">
        <svg viewBox="0 0 32 23"><rect width="32" height="23" fill="#009c3b"/><path d="M16 3 L29 11.5 L16 20 L3 11.5 Z" fill="#ffdf00"/><circle cx="16" cy="11.5" r="4.8" fill="#002776"/></svg>
      </button>
      <button class="flag" data-lang="en" title="English">
        <svg viewBox="0 0 32 23">
          <rect width="32" height="23" fill="#b22234"/>
          <g fill="#fff"><rect y="1.77" width="32" height="1.77"/><rect y="5.31" width="32" height="1.77"/><rect y="8.85" width="32" height="1.77"/><rect y="12.38" width="32" height="1.77"/><rect y="15.92" width="32" height="1.77"/><rect y="19.46" width="32" height="1.77"/></g>
          <rect width="14" height="12.38" fill="#3c3b6e"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="canvas">
    <div id="world">
      <svg id="wires" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L7,3.2 L0,6.4 Z" fill="var(--wire)"></path>
          </marker>
          <marker id="arrow-stop" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L7,3.2 L0,6.4 Z" fill="var(--stop-bd)"></path>
          </marker>
        </defs>
      </svg>
    </div>

    <div class="legend" id="uiLegend">
      <div class="row"><span class="sw" style="background:var(--start-bg);border-color:var(--start)"></span><span class="lg-t"></span></div>
      <div class="row"><span class="sw" style="background:var(--card);border-left:4px solid var(--proc-ac)"></span><span class="lg-t"></span></div>
      <div class="row"><span class="sw dia" style="background:var(--dec-fill);border-color:var(--dec-bd)"></span><span class="lg-t"></span></div>
      <div class="row"><span class="sw" style="background:var(--act-bg);border-color:var(--act-bd)"></span><span class="lg-t"></span></div>
      <div class="row"><span class="sw" style="background:var(--stop-bg);border-color:var(--stop-bd)"></span><span class="lg-t"></span></div>
    </div>

    <div class="controls">
      <button class="fitbtn" id="fit"></button>
      <div class="zoombox">
        <button id="zout">−</button>
        <div class="pct" id="pct">100%</div>
        <button id="zin">+</button>
      </div>
    </div>
  </div>

  <aside id="drawer" aria-hidden="true">
    <div class="dw-head">
      <span class="dw-badge" id="dwBadge"></span>
      <h2 class="dw-title" id="dwTitle"></h2>
      <button class="dw-close" id="dwClose"></button>
    </div>
    <div class="dw-body" id="dwBody"></div>
  </aside>

<script>
/* ================= NÓS ================= */
const NODES = {
  start:   {x:365, y:30,  w:210, h:56,  kind:'start', ttl:{pt:'Pipeline inicia',en:'Pipeline starts'}},
  cfg:     {x:340, y:150, w:260, h:74,  kind:'proc',  ttl:{pt:'Carrega e valida as configurações',en:'Loads and validates the configuration'}, sub:{pt:'Confere se tudo que é obrigatório está definido',en:'Checks that everything required is defined'}},
  dCfg:    {x:345, y:284, w:250, h:118, kind:'dec',   ttl:{pt:'A configuração está completa?',en:'Is the configuration complete?'}},
  stopCfg: {x:770, y:307, w:240, h:74,  kind:'stop',  ttl:{pt:'Encerra a execução',en:'Stops the run'}, sub:{pt:'Informa quais itens estão faltando',en:'Reports which items are missing'}},
  db:      {x:340, y:456, w:260, h:72,  kind:'proc',  ttl:{pt:'Prepara o acesso ao banco de dados',en:'Prepares access to the database'}},
  dDb:     {x:345, y:562, w:250, h:118, kind:'dec',   ttl:{pt:'O banco de dados já existe?',en:'Does the database already exist?'}},
  create:  {x:40,  y:586, w:240, h:74,  kind:'act',   ttl:{pt:'Cria o banco de dados',en:'Creates the database'}},
  reuse:   {x:770, y:586, w:240, h:74,  kind:'act',   ttl:{pt:'Reutiliza o banco existente',en:'Reuses the existing database'}},
  struct:  {x:325, y:760, w:290, h:78,  kind:'proc',  ttl:{pt:'Garante a estrutura dos dados brutos',en:'Ensures the raw data structure'}, sub:{pt:'Cria as tabelas de armazenamento que faltarem',en:'Creates any missing storage tables'}},
  dMode:   {x:345, y:896, w:250, h:118, kind:'dec',   ttl:{pt:'As tabelas já têm dados?',en:'Do the tables already have data?'}},
  inc:     {x:770, y:920, w:240, h:78,  kind:'mode',  ttl:{pt:'Carga incremental',en:'Incremental load'}, sub:{pt:'Busca só os períodos recentes',en:'Fetches only the recent periods'}},
  found:   {x:40,  y:920, w:240, h:78,  kind:'mode',  ttl:{pt:'Carga inicial completa',en:'Full initial load'}, sub:{pt:'Traz todo o histórico disponível',en:'Brings the entire available history'}},
  extract: {x:310, y:1096,w:320, h:86,  kind:'proc',  ttl:{pt:'Extrai as fontes e guarda os dados brutos',en:'Extracts the sources and stores the raw data'}, sub:{pt:'As 5 fontes são processadas uma após a outra',en:'The 5 sources are processed one after another'}},
  dFail:   {x:345, y:1238,w:250, h:118, kind:'dec',   ttl:{pt:'Alguma fonte falhou?',en:'Did any source fail?'}},
  stopFail:{x:770, y:1259,w:250, h:86,  kind:'stop',  ttl:{pt:'Interrompe tudo',en:'Stops everything'}, sub:{pt:'Nada é transformado — falha para imediatamente',en:'Nothing is transformed — it fails immediately'}},
  transform:{x:305,y:1418,w:330, h:86,  kind:'proc',  ttl:{pt:'Transforma os dados',en:'Transforms the data'}, sub:{pt:'RAW → Silver → Rules → Gold',en:'RAW → Silver → Rules → Gold'}},
  end:     {x:310, y:1560,w:320, h:62,  kind:'end',   ttl:{pt:'Data Warehouse limpo e organizado',en:'Clean, organized Data Warehouse'}},
};

const EDGES = [
  ['start','bottom','cfg','top'],
  ['cfg','bottom','dCfg','top'],
  ['dCfg','right','stopCfg','left',null,'no',true],
  ['dCfg','bottom','db','top',null,'yes'],
  ['db','bottom','dDb','top'],
  ['dDb','left','create','right',null,'no'],
  ['dDb','right','reuse','left',null,'yes'],
  ['create','bottom','struct','top'],
  ['reuse','bottom','struct','top'],
  ['struct','bottom','dMode','top'],
  ['dMode','right','inc','left',null,'yes'],
  ['dMode','left','found','right',null,'no'],
  ['inc','bottom','extract','top'],
  ['found','bottom','extract','top'],
  ['extract','bottom','dFail','top'],
  ['dFail','right','stopFail','left',null,'yes',true],
  ['dFail','bottom','transform','top',null,'no'],
  ['transform','bottom','end','top'],
];

/* ================= UI (estático) ================= */
const UI = {
  pt:{ sub:'Documentação do processo',
    tabs:['Fluxo do processo','Fontes de dados','Camadas do banco','Regras & riscos'],
    hint:'<b>Clique em uma etapa</b> para ver os detalhes · arraste para mover · role para zoom',
    legend:['Início / fim','Etapa do processo','Decisão','Ação sobre o banco','Interrupção'],
    fit:'Ajustar à tela', eyebrow:'Decisão', close:'✕',
    badges:{start:'Início',end:'Fim',proc:'Etapa do processo',dec:'Decisão',act:'Ação sobre o banco',mode:'Modo de carga',stop:'Interrupção'},
    yes:'Sim', no:'Não' },
  en:{ sub:'Process documentation',
    tabs:['Process flow','Data sources','Database layers','Rules & risks'],
    hint:'<b>Click a step</b> to see details · drag to move · scroll to zoom',
    legend:['Start / end','Process step','Decision','Action on the database','Stop'],
    fit:'Fit to screen', eyebrow:'Decision', close:'✕',
    badges:{start:'Start',end:'End',proc:'Process step',dec:'Decision',act:'Action on the database',mode:'Load mode',stop:'Stop'},
    yes:'Yes', no:'No' },
};
const BADGE_STYLE={start:['var(--start)','var(--start-bg)'],end:['var(--end)','var(--end-bg)'],
  proc:['var(--proc-ac)','#eef1f5'],dec:['var(--dec-ink)','var(--dec-fill)'],
  act:['var(--act-ink)','var(--act-bg)'],mode:['var(--mode-ink)','var(--mode-bg)'],stop:['var(--stop-ink)','var(--stop-bg)']};

/* ================= DETALHES ================= */
const DETAILS = {
pt:{
  start:{lead:'A execução do ETL é iniciada manualmente. É possível rodar todas as fontes ou apenas um subconjunto escolhido, e em um de dois modos de carga (inicial ou incremental).'},
  cfg:{lead:'Antes de tocar em qualquer fonte, o sistema reúne as configurações e confirma que nada obrigatório está faltando. Nenhum valor ou senha é exibido em tela.',
    secs:[
      {h:'De onde vêm as configurações',items:['De um arquivo de ambiente (<code>.env</code>) na raiz do projeto;','E das variáveis já definidas no sistema operacional (Windows) — que <b>têm prioridade</b> sobre o arquivo.']},
      {h:'O que é obrigatório existir',items:['<b>Banco de dados:</b> host, porta, usuário, senha e nome do banco;','<b>Sistema da lavanderia:</b> chave de acesso (API) e identificador da empresa;','<b>Conta bancária 1:</b> usuário e senha;','<b>Conta bancária 2:</b> usuário e senha;','<b>E-mail:</b> servidor e porta (IMAP), usuário e senha;','<b>Pastas:</b> caminho base de apoio e pasta de downloads.']}
    ]},
  dCfg:{lead:'Ponto de decisão: todas as configurações obrigatórias foram encontradas?',
    secs:[{h:'Sim',items:['O processo segue para preparar o banco de dados.']},{h:'Não',items:['A execução para imediatamente e informa apenas os nomes do que está faltando.']}]},
  stopCfg:{lead:'Falta configuração obrigatória. A execução é encerrada de forma segura, antes de acessar o banco ou qualquer fonte.',

/* ================= RENDER ================= */
let LANG='pt';
const world=document.getElementById('world'), svg=document.getElementById('wires');
const NS='http://www.w3.org/2000/svg';

let maxX=0,maxY=0;
for(const k in NODES){const n=NODES[k];maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+n.h);}
const W=maxX+60,H=maxY+60;
world.style.width=W+'px';world.style.height=H+'px';
svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

function anchor(n,s){const cx=n.x+n.w/2,cy=n.y+n.h/2;
  return s==='top'?{x:cx,y:n.y}:s==='bottom'?{x:cx,y:n.y+n.h}:s==='left'?{x:n.x,y:cy}:{x:n.x+n.w,y:cy};}
function points(a,b,as,bs){
  if(as==='bottom'&&bs==='top'){ if(Math.abs(a.x-b.x)<1)return[a,b];
    const my=(a.y+b.y)/2;return[a,{x:a.x,y:my},{x:b.x,y:my},b];}
  if((as==='right'&&bs==='left')||(as==='left'&&bs==='right')){ if(Math.abs(a.y-b.y)<1)return[a,b];
    const mx=(a.x+b.x)/2;return[a,{x:mx,y:a.y},{x:mx,y:b.y},b];}
  return[a,b];
}
function roundPath(pts,r){
  if(pts.length<3)return`M${pts[0].x},${pts[0].y} L${pts[pts.length-1].x},${pts[pts.length-1].y}`;
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const v1={x:p1.x-p0.x,y:p1.y-p0.y},v2={x:p2.x-p1.x,y:p2.y-p1.y};
    const l1=Math.hypot(v1.x,v1.y)||1,l2=Math.hypot(v2.x,v2.y)||1;const rr=Math.min(r,l1/2,l2/2);
    const A={x:p1.x-v1.x/l1*rr,y:p1.y-v1.y/l1*rr},B={x:p1.x+v2.x/l2*rr,y:p1.y+v2.y/l2*rr};
    d+=` L${A.x},${A.y} Q${p1.x},${p1.y} ${B.x},${B.y}`;}
  const last=pts[pts.length-1];d+=` L${last.x},${last.y}`;return d;
}

const edgeLabels=[];
EDGES.forEach((e,i)=>{
  const[f,fs,t,ts,,tone,stop]=e;
  const a=anchor(NODES[f],fs),b=anchor(NODES[t],ts),pts=points(a,b,fs,ts);
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',roundPath(pts,16));
  p.setAttribute('class','wpath'+(stop?' stop':''));
  p.setAttribute('marker-end',stop?'url(#arrow-stop)':'url(#arrow)');
  p.style.animationDelay=(0.2+i*0.045)+'s';svg.appendChild(p);
  if(tone){
    const l=document.createElement('div');l.className='elbl '+tone;
    l.style.left=((pts[0].x+pts[1].x)/2)+'px';l.style.top=((pts[0].y+pts[1].y)/2)+'px';
    l.style.animationDelay=(0.4+i*0.045)+'s';world.appendChild(l);
    edgeLabels.push({el:l,tone});
  }
});

const clsFor={start:'n-term n-start',end:'n-term n-end',proc:'n-proc',act:'n-act',mode:'n-mode',stop:'n-stop',dec:'n-dec'};
let ni=0;
for(const k in NODES){
  const n=NODES[k];
  const el=document.createElement('div');
  el.className='node '+clsFor[n.kind];el.dataset.id=k;
  el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.width=n.w+'px';el.style.height=n.h+'px';
  el.style.animationDelay=(ni*0.055)+'s';ni++;
  if(n.kind==='dec'){
    el.innerHTML='<div class="inner"><span class="eye"></span><div class="ttl"></div><span class="diamark">＋</span></div>';
    n._eyeEl=el.querySelector('.eye');
  }else{
    el.innerHTML='<div class="ttl"></div>'+(n.sub?'<div class="sub"></div>':'')+'<span class="plus">＋</span>';
  }
  n._ttlEl=el.querySelector('.ttl');
  n._subEl=el.querySelector('.sub');
  el.addEventListener('click',ev=>{ev.stopPropagation();open(k,el);});
  world.appendChild(el);n._el=el;
}

/* ================= DRAWER ================= */
const drawer=document.getElementById('drawer');
const dwBadge=document.getElementById('dwBadge'),dwTitle=document.getElementById('dwTitle'),dwBody=document.getElementById('dwBody');
let activeEl=null,activeId=null;
function fillDrawer(id){
  const n=NODES[id],d=(DETAILS[LANG][id])||{lead:''};
  const[col,bg]=BADGE_STYLE[n.kind];
  dwBadge.textContent=UI[LANG].badges[n.kind];dwBadge.style.color=col;dwBadge.style.background=bg;
  dwTitle.textContent=n.ttl[LANG];
  let html='<p class="dw-lead">'+(d.lead||'')+'</p>';
  (d.secs||[]).forEach(s=>{html+='<div class="dw-sec"><h4>'+s.h+'</h4><ul>'+s.items.map(it=>'<li>'+it+'</li>').join('')+'</ul></div>';});
  if(d.note)html+='<div class="dw-note">'+d.note+'</div>';
  dwBody.innerHTML=html;dwBody.scrollTop=0;
}
function open(id,el){
  activeId=id;fillDrawer(id);
  drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');
  if(activeEl)activeEl.classList.remove('active');
  el.classList.add('active');activeEl=el;focus(NODES[id]);
}
function closeDrawer(){
  drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');
  if(activeEl){activeEl.classList.remove('active');activeEl=null;}activeId=null;
}
document.getElementById('dwClose').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

/* ================= IDIOMA ================= */
function applyLang(){
  document.body.classList.toggle('en',LANG==='en');
  document.documentElement.lang = LANG==='en'?'en':'pt-BR';
  const u=UI[LANG];
  document.getElementById('uiSub').textContent=u.sub;
  const tabEls=document.querySelectorAll('#uiTabs .tab span');
  tabEls.forEach((s,i)=>s.textContent=u.tabs[i]);
  document.getElementById('uiHint').innerHTML=u.hint;
  document.querySelectorAll('#uiLegend .lg-t').forEach((s,i)=>s.textContent=u.legend[i]);
  document.getElementById('fit').textContent=u.fit;
  document.getElementById('dwClose').textContent=u.close;
  for(const k in NODES){const n=NODES[k];
    if(n._ttlEl)n._ttlEl.textContent=n.ttl[LANG];
    if(n._subEl&&n.sub)n._subEl.textContent=n.sub[LANG];
    if(n._eyeEl)n._eyeEl.textContent=u.eyebrow;}
  edgeLabels.forEach(o=>o.el.textContent=(o.tone==='yes'?u.yes:u.no));
  if(activeId)fillDrawer(activeId);
}
function setLang(l){
  if(l===LANG)return;LANG=l;
  document.querySelectorAll('.flag').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  applyLang();
}
document.querySelectorAll('.flag').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* ================= PAN / ZOOM ================= */
const canvas=document.getElementById('canvas'),pct=document.getElementById('pct');
let scale=1,tx=0,ty=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;pct.textContent=Math.round(scale*100)+'%';}
function initialView(){
  const vw=canvas.clientWidth;
  scale=clamp(Math.min(1.05,(vw-56)/780),0.55,1.1);
  tx=vw/2-470*scale;ty=24;apply();
}
function fit(){
  const vw=canvas.clientWidth,vh=canvas.clientHeight;
  scale=clamp(Math.min(vw/W,vh/H)*0.92,0.3,1.4);
  tx=(vw-W*scale)/2;ty=(vh-H*scale)/2+4;apply();
}
function focus(n){
  const cx=n.x+n.w/2,cy=n.y+n.h/2,vw=canvas.clientWidth,vh=canvas.clientHeight;
  const rightRoom=Math.min(400,vw*0.88);
  tx=(vw-rightRoom)*0.5-cx*scale;ty=vh*0.44-cy*scale;
  world.style.transition='transform .5s cubic-bezier(.2,.7,.3,1)';apply();
  setTimeout(()=>{world.style.transition='';},520);
}
function zoomAt(ns,mx,my){ns=clamp(ns,0.3,2.4);
  const wx=(mx-tx)/scale,wy=(my-ty)/scale;scale=ns;tx=mx-wx*scale;ty=my-wy*scale;apply();}
document.getElementById('zin').onclick=()=>zoomAt(scale*1.2,canvas.clientWidth/2,canvas.clientHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(scale/1.2,canvas.clientWidth/2,canvas.clientHeight/2);
document.getElementById('fit').onclick=fit;
canvas.addEventListener('wheel',e=>{e.preventDefault();
  const r=canvas.getBoundingClientRect(),factor=e.ctrlKey?0.012:0.0016;
  zoomAt(scale*(1-e.deltaY*factor),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=false,moved=false,sx,sy,ox,oy;
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.node'))return;
  drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;
  canvas.classList.add('grabbing');canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;
  tx=ox+(e.clientX-sx);ty=oy+(e.clientY-sy);
  if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4)moved=true;apply();});
function endDrag(){if(drag&&!moved)closeDrawer();drag=false;canvas.classList.remove('grabbing');}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

applyLang();
initialView();
</script>
