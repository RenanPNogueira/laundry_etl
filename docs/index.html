<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETL · Lav &amp; Sec Express — Documentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ============ TEMA (claro / escuro) ============ */
  :root{
    --bg:#eef0f4;
    --canvas:#f3f4f7; --dot:#dde1e9;
    --ink:#242b37; --muted:#697384; --faint:#8a94a4; --body-ink:#39424f;
    --card:#ffffff; --card-bd:#e3e7ee; --card-sh:0 4px 16px rgba(28,39,60,.07);
    --th-bg:#f7f8fb; --row-hover:#fafbfc; --hair:#eef1f5;
    --code-bg:#f1f3f7; --code-bd:#e4e8ee; --code-ink:#33404d;
    --wire:#9aa4b4; --wire-lbl:#4b5568;
    --proc-ac:#586579;
    --start:#0e9f6e; --start-bg:#e6f6ef;
    --end:#bd8410; --end-bg:#fbf1d8;
    --dec-bd:#dda224; --dec-fill:#fff8e6; --dec-ink:#8a5900; --dec-hl:#fff3cf;
    --act-bd:#2f6fed; --act-bg:#eaf1fe; --act-ink:#1c47a0;
    --mode-bd:#7c53e0; --mode-bg:#f2ecfd; --mode-ink:#5a34ad;
    --stop-bd:#df4438; --stop-bg:#fdeae7; --stop-ink:#a1281e; --stop-note:#8f342b;
    /* camadas */
    --raw:#bf7833; --raw-bg:#f6ecdf;
    --silver:#7c899e; --silver-bg:#edf0f4;
    --rules:#178a7c; --rules-bg:#e2f3f0;
    --gold:#b8901c; --gold-bg:#f8efd4; --gold-line:#dcb445; --gold-body:#4a4327;
    --load-bd:#3f56cf; --load-bg:#ebeefc; --load-ink:#33429f;
    --rebuild-bd:#d68a12; --rebuild-bg:#fdf2da; --rebuild-ink:#8a5a00;
    /* fontes */
    --fam-api:#128577; --fam-api-bg:#e4f4f1;
    --fam-brw:#3f56cf; --fam-brw-bg:#ebeefc;
    --fam-file:#c07d1c; --fam-file-bg:#fbf0dc;
    --warn-bd:#d68a12; --warn-bg:#fdf2da; --warn-ink:#8a5a00;
    --ok:#0e9f6e; --ok-bg:#e6f6ef;

    --disp:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  body.dark{
    --bg:#0e1320;
    --canvas:#141a26; --dot:#232c3d;
    --ink:#e7eaf0; --muted:#9aa4b4; --faint:#7a8598; --body-ink:#c4cede;
    --card:#1a2130; --card-bd:#2a3344; --card-sh:0 6px 20px rgba(0,0,0,.45);
    --th-bg:#1f2735; --row-hover:#212a3a; --hair:#273040;
    --code-bg:#232c3d; --code-bd:#33415a; --code-ink:#cdd6e4;
    --wire:#5f6b7e; --wire-lbl:#aab4c4;
    --proc-ac:#8a94a4;
    --start:#34d399; --start-bg:#0f2a20;
    --end:#e0b34a; --end-bg:#2b2410;
    --dec-bd:#e0b34a; --dec-fill:#2a2412; --dec-ink:#e9c96a; --dec-hl:#37301a;
    --act-bd:#5b8def; --act-bg:#13233c; --act-ink:#a9c6f7;
    --mode-bd:#a385f0; --mode-bg:#221a38; --mode-ink:#c9b6f7;
    --stop-bd:#ef6a5f; --stop-bg:#2c1512; --stop-ink:#f3a89f; --stop-note:#f3a89f;
    --raw:#d18f4e; --raw-bg:#2a1f12;
    --silver:#9aa6ba; --silver-bg:#1f2530;
    --rules:#2bb3a1; --rules-bg:#0f2621;
    --gold:#d8ad30; --gold-bg:#2a2411; --gold-line:#5a4a1a; --gold-body:#e6d9a8;
    --load-bd:#7d92f0; --load-bg:#141d33; --load-ink:#a9b6f7;
    --rebuild-bd:#e0a94a; --rebuild-bg:#2a2210; --rebuild-ink:#e6c07a;
    --fam-api:#22b3a1; --fam-api-bg:#0f2621;
    --fam-brw:#7d92f0; --fam-brw-bg:#141d33;
    --fam-file:#d69a3c; --fam-file-bg:#2a2211;
    --warn-bd:#e0a94a; --warn-bg:#2a2210; --warn-ink:#e6c07a;
    --ok:#34d399; --ok-bg:#0f2a20;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);
    transition:background .25s ease,color .25s ease}
  body.flow{overflow:hidden}

  /* ============ TOP BAR (global) ============ */
  .bar{height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;
    background:var(--card);border-bottom:1px solid var(--card-bd);
    position:fixed;top:0;left:0;right:0;z-index:60}
  .brand{display:flex;flex-direction:column;line-height:1.15;flex:none}
  .brand .t{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .s{font-size:11.5px;color:var(--muted)}
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{font-size:13px;font-weight:500;color:var(--muted);padding:8px 13px;border-radius:9px;
    background:transparent;border:1px solid transparent;cursor:pointer;white-space:nowrap;
    font-family:var(--body)}
  .tab:hover{color:var(--ink);background:var(--canvas)}
  .tab.active{color:var(--ink);background:var(--canvas);border-color:var(--card-bd);font-weight:600}
  .bar .spacer{flex:1}
  .hint{font-size:12px;color:var(--muted);white-space:nowrap}
  .hint b{color:var(--ink);font-weight:600}
  @media (max-width:1180px){ .hint{display:none} }
  @media (max-width:860px){ .brand .s{display:none} }
  @media (max-width:720px){ .tabs{font-size:12px} .tab{padding:7px 9px} }

  .toolbar{display:flex;align-items:center;gap:10px;flex:none}
  .themebtn{width:36px;height:30px;border:1px solid var(--card-bd);border-radius:8px;background:var(--card);
    cursor:pointer;color:var(--ink);display:grid;place-items:center;transition:background .15s,transform .1s}
  .themebtn:hover{background:var(--canvas)}
  .themebtn:active{transform:scale(.94)}
  .themebtn svg{width:17px;height:17px}
  .themebtn .moon{display:none}
  body.dark .themebtn .sun{display:none}
  body.dark .themebtn .moon{display:block}

  .langsw{display:flex;gap:6px;flex:none}
  .flag{width:32px;height:23px;padding:0;border:1px solid var(--card-bd);border-radius:6px;overflow:hidden;
    cursor:pointer;background:var(--card);opacity:.42;transition:opacity .15s, box-shadow .15s, transform .1s}
  .flag:hover{opacity:.8}
  .flag.active{opacity:1;box-shadow:0 0 0 2px rgba(47,111,237,.35)}
  .flag:active{transform:scale(.94)}
  .flag svg{display:block;width:100%;height:100%}

  /* ============ VIEW SWITCHING ============ */
  .view{display:none}
  .view.active{display:block}

  /* ============ VIEW: FLUXO DO PROCESSO ============ */
  #canvas{position:fixed;inset:60px 0 0 0;overflow:hidden;cursor:grab;
    background-color:var(--canvas);
    background-image:radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size:26px 26px}
  #canvas.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0}
  #wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .wpath{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linecap:round}
  .wpath.stop{stroke:var(--stop-bd);stroke-dasharray:6 6}
  #wires marker#arrow path{fill:var(--wire)}
  #wires marker#arrow-stop path{fill:var(--stop-bd)}

  .node{position:absolute;user-select:none;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:var(--card-sh);transition:transform .16s ease, box-shadow .16s ease}
  .node:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(28,39,60,.15);z-index:6}
  .node.active{box-shadow:0 0 0 3px rgba(47,111,237,.35), 0 10px 26px rgba(28,39,60,.16)}
  .node .ttl{font-family:var(--disp);font-weight:600;font-size:14.5px;line-height:1.22}
  .node .sub{font-size:11.8px;color:var(--muted);margin-top:5px;line-height:1.35}

  .n-proc{background:var(--card);border:1px solid var(--card-bd);border-left:4px solid var(--proc-ac);
    border-radius:12px;padding:14px 16px}
  .n-term{border-radius:999px;padding:0 22px;align-items:center;text-align:center}
  .n-term .ttl{font-family:var(--disp);font-weight:700;font-size:15px}
  .n-start{background:var(--start-bg);border:1.5px solid var(--start)} .n-start .ttl{color:var(--start)}
  .n-end{background:var(--end-bg);border:1.5px solid var(--end)} .n-end .ttl{color:var(--end);font-size:14px}
  .n-act{border-radius:12px;padding:13px 16px;background:var(--act-bg);border:1px solid var(--act-bd)}
  .n-act .ttl{color:var(--act-ink)}
  .n-mode{border-radius:12px;padding:13px 16px;background:var(--mode-bg);border:1px solid var(--mode-bd)}
  .n-mode .ttl{color:var(--mode-ink)}
  .n-stop{border-radius:12px;padding:13px 16px;background:var(--stop-bg);border:1px solid var(--stop-bd)}
  .n-stop .ttl{color:var(--stop-ink)} .n-stop .sub{color:var(--stop-ink)}

  .node .plus{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
    background:var(--card);border:1px solid var(--card-bd);color:var(--muted);font-size:13px;line-height:18px;
    text-align:center;box-shadow:0 2px 5px rgba(28,39,60,.12);opacity:0;transition:opacity .16s}
  .node:hover .plus,.node.active .plus{opacity:1}

  .n-dec{background:var(--dec-bd);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:none;padding:0}
  .n-dec .inner{position:absolute;inset:2px;background:var(--dec-fill);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:0 46px}
  .n-dec .ttl{font-size:13.5px;color:var(--dec-ink)}
  .n-dec .eye{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.16em;color:var(--dec-bd);font-weight:700;text-transform:uppercase}
  .n-dec.active .inner{background:var(--dec-hl)}
  .n-dec .diamark{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--dec-bd);opacity:0;transition:opacity .16s}
  .n-dec:hover .diamark,.n-dec.active .diamark{opacity:1}

  .elbl{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--card-bd);
    color:var(--wire-lbl);font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
    box-shadow:0 1px 3px rgba(28,39,60,.08);white-space:nowrap;pointer-events:none}
  .elbl.yes{color:var(--ok);border-color:var(--start)}
  .elbl.no{color:var(--stop-ink);border-color:var(--stop-bd)}

  .node{opacity:0;animation:pop .5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  #wires .wpath{opacity:0;animation:fade .6s ease forwards}
  .elbl{opacity:0;animation:fade .5s ease forwards}
  @keyframes fade{to{opacity:1}}

  .controls{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .zoombox{display:flex;align-items:center;background:var(--card);border:1px solid var(--card-bd);border-radius:12px;
    box-shadow:var(--card-sh);overflow:hidden}
  .zoombox button{border:none;background:var(--card);width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink)}
  .zoombox button:hover{background:var(--canvas)}
  .zoombox .pct{width:52px;text-align:center;font-size:12px;color:var(--muted);
    border-left:1px solid var(--card-bd);border-right:1px solid var(--card-bd);height:38px;line-height:38px}
  .fitbtn{background:var(--card);border:1px solid var(--card-bd);border-radius:10px;padding:9px 14px;font-size:12.5px;
    font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--card-sh);font-family:var(--body)}
  .fitbtn:hover{background:var(--canvas)}

  .flow-legend{position:fixed;left:20px;bottom:20px;z-index:50;background:var(--card);border:1px solid var(--card-bd);
    border-radius:12px;box-shadow:var(--card-sh);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
  .flow-legend .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .flow-legend .sw{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.06)}
  .flow-legend .sw.dia{border-radius:2px;transform:rotate(45deg);width:11px;height:11px}
  @media (max-width:760px){ .flow-legend{display:none} }

  #drawer{position:fixed;top:60px;right:0;bottom:0;width:400px;max-width:88vw;background:var(--card);
    border-left:1px solid var(--card-bd);box-shadow:-14px 0 40px rgba(28,39,60,.12);z-index:55;
    transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.3,1);
    display:flex;flex-direction:column}
  #drawer.open{transform:none}
  .dw-head{padding:22px 24px 16px;border-bottom:1px solid var(--card-bd);position:relative}
  .dw-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;margin-bottom:12px}
  .dw-title{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.2;margin:0;padding-right:34px;color:var(--ink)}
  .dw-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:9px;border:1px solid var(--card-bd);
    background:var(--card);cursor:pointer;font-size:17px;color:var(--muted);line-height:30px}
  .dw-close:hover{background:var(--canvas);color:var(--ink)}
  .dw-body{padding:20px 24px 40px;overflow-y:auto}
  .dw-lead{font-size:14px;color:var(--ink);line-height:1.55;margin:0 0 18px}
  .dw-sec{margin-bottom:18px}
  .dw-sec h4{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--muted);
    text-transform:uppercase;margin:0 0 9px}
  .dw-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .dw-sec li{font-size:13.3px;line-height:1.45;padding-left:16px;position:relative;color:var(--body-ink)}
  .dw-sec li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:var(--proc-ac)}
  .dw-sec li b{color:var(--ink);font-weight:600}
  .dw-sec code{font-family:var(--mono);font-size:11.6px;background:var(--code-bg);border:1px solid var(--code-bd);
    border-radius:5px;padding:1px 6px;color:var(--code-ink)}
  .dw-note{font-size:12.5px;line-height:1.45;background:var(--stop-bg);border:1px solid var(--stop-bd);color:var(--stop-note);
    border-radius:10px;padding:11px 13px;margin-top:4px}
  .dw-note b{color:var(--stop-note)}

  @media (prefers-reduced-motion:reduce){
    .node,.elbl,#wires .wpath{animation:none;opacity:1}
    .node{transform:none}
    #drawer{transition:none}
  }

  /* ============ VIEW: FONTES DE DADOS (escopo) ============ */
  .view-sources{
    .page{min-height:100vh;padding-top:60px;
      background-color:var(--canvas);
      background-image:radial-gradient(var(--dot) 1.2px, transparent 1.2px);
      background-size:26px 26px}
    .wrap{max-width:1140px;margin:0 auto;padding:44px 28px 90px}
    .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
      color:var(--fam-api);display:inline-flex;align-items:center;gap:9px;margin-bottom:14px}
    .eyebrow::before{content:"";width:22px;height:1px;background:var(--fam-api)}
    h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.4vw,44px);letter-spacing:-.02em;margin:0 0 14px}
    .lead{max-width:660px;color:var(--muted);font-size:16px;line-height:1.55;margin:0}
    .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
    .stat{background:var(--card);border:1px solid var(--card-bd);border-radius:12px;padding:12px 18px;box-shadow:var(--card-sh)}
    .stat .n{font-family:var(--disp);font-weight:700;font-size:22px}
    .stat .l{color:var(--muted);font-size:12.5px}
    .stat.warn{border-color:var(--warn-bd);background:var(--warn-bg)} .stat.warn .n{color:var(--warn-ink)}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    .legend .fchip{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:500;
      border:1px solid var(--card-bd);background:var(--card);border-radius:999px;padding:6px 13px 6px 8px;color:var(--ink)}
    .legend .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
    .legend .ic svg{width:14px;height:14px;stroke-width:2}
    .legend .manual{margin-left:auto;color:var(--warn-ink);border-color:var(--warn-bd);background:var(--warn-bg)}
    @media (max-width:720px){ .legend .manual{margin-left:0} }
    .sec{margin-top:44px}
    .sec-head{margin-bottom:18px}
    .sec-head h2{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0}
    .sec-head p{color:var(--muted);font-size:14px;margin:4px 0 0}
    .mtx-scroll{overflow-x:auto;border:1px solid var(--card-bd);border-radius:14px;background:var(--card);box-shadow:var(--card-sh)}
    table.mtx{border-collapse:collapse;width:100%;min-width:820px;font-size:13.2px}
    table.mtx thead th{background:var(--th-bg);color:var(--muted);font-weight:600;text-align:left;
      font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:13px 16px;border-bottom:1px solid var(--card-bd);white-space:nowrap}
    table.mtx td{padding:14px 16px;border-bottom:1px solid var(--hair);vertical-align:top}
    table.mtx tbody tr:last-child td{border-bottom:none}
    table.mtx tbody tr:hover td{background:var(--row-hover)}
    .mtx .src-cell{border-left:4px solid var(--fc);padding-left:14px}
    .mtx .src-cell .nm{font-weight:600;color:var(--ink);line-height:1.25}
    .mtx .fam-tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--fc)}
    .mtx .fam-tag .dot{width:8px;height:8px;border-radius:3px;background:var(--fc)}
    .mtx code{font-family:var(--mono);font-size:11.4px;background:var(--code-bg);border:1px solid var(--code-bd);border-radius:5px;padding:1px 6px;color:var(--code-ink)}
    .pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .pill.yes{color:var(--ok);background:var(--ok-bg)}
    .pill.no{color:var(--muted);background:var(--hair)}
    .pill.manual{color:var(--warn-ink);background:var(--warn-bg)}
    .pill.auto{color:var(--fam-api);background:var(--fam-api-bg)}
    .pill.stop{color:var(--stop-ink);background:var(--stop-bg)}
    .pill.warn{color:var(--warn-ink);background:var(--warn-bg)}
    .fam{margin-top:34px}
    .fam-band{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .fam-band .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
    .fam-band .ic svg{width:19px;height:19px;stroke-width:2}
    .fam-band .txt .h{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--fc)}
    .fam-band .txt .c{font-size:12px;color:var(--muted)}
    .fam-band .rule{flex:1;height:1px;background:var(--card-bd)}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
    .grid.one{grid-template-columns:1fr}
    @media (max-width:860px){ .grid{grid-template-columns:1fr} }
    .src{background:var(--card);border:1px solid var(--card-bd);border-top:3px solid var(--fc);
      border-radius:14px;box-shadow:var(--card-sh);overflow:hidden;display:flex;flex-direction:column}
    .src-top{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
    .src-num{font-family:var(--mono);font-size:12px;color:var(--fc);font-weight:600;flex:none}
    .src-name{font-family:var(--disp);font-weight:600;font-size:15.5px;line-height:1.2;flex:1}
    .src-body{padding:0 18px 4px}
    .fld{padding:11px 0;border-top:1px solid var(--hair)}
    .fld:first-child{border-top:none}
    .fld h5{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}

const world=document.getElementById('world'), svg=document.getElementById('wires');
const NS='http://www.w3.org/2000/svg';

let maxX=0,maxY=0;
for(const k in NODES){const n=NODES[k];maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+n.h);}
const W=maxX+60,H=maxY+60;
world.style.width=W+'px';world.style.height=H+'px';
svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

function anchor(n,s){const cx=n.x+n.w/2,cy=n.y+n.h/2;
  return s==='top'?{x:cx,y:n.y}:s==='bottom'?{x:cx,y:n.y+n.h}:s==='left'?{x:n.x,y:cy}:{x:n.x+n.w,y:cy};}
function points(a,b,as,bs){
  if(as==='bottom'&&bs==='top'){ if(Math.abs(a.x-b.x)<1)return[a,b];
    const my=(a.y+b.y)/2;return[a,{x:a.x,y:my},{x:b.x,y:my},b];}
  if((as==='right'&&bs==='left')||(as==='left'&&bs==='right')){ if(Math.abs(a.y-b.y)<1)return[a,b];
    const mx=(a.x+b.x)/2;return[a,{x:mx,y:a.y},{x:mx,y:b.y},b];}
  return[a,b];
}
function roundPath(pts,r){
  if(pts.length<3)return`M${pts[0].x},${pts[0].y} L${pts[pts.length-1].x},${pts[pts.length-1].y}`;
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const v1={x:p1.x-p0.x,y:p1.y-p0.y},v2={x:p2.x-p1.x,y:p2.y-p1.y};
    const l1=Math.hypot(v1.x,v1.y)||1,l2=Math.hypot(v2.x,v2.y)||1;const rr=Math.min(r,l1/2,l2/2);
    const A={x:p1.x-v1.x/l1*rr,y:p1.y-v1.y/l1*rr},B={x:p1.x+v2.x/l2*rr,y:p1.y+v2.y/l2*rr};
    d+=` L${A.x},${A.y} Q${p1.x},${p1.y} ${B.x},${B.y}`;}
  const last=pts[pts.length-1];d+=` L${last.x},${last.y}`;return d;
}

const edgeLabels=[];
EDGES.forEach((e,i)=>{
  const[f,fs,t,ts,,tone,stop]=e;
  const a=anchor(NODES[f],fs),b=anchor(NODES[t],ts),pts=points(a,b,fs,ts);
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',roundPath(pts,16));
  p.setAttribute('class','wpath'+(stop?' stop':''));
  p.setAttribute('marker-end',stop?'url(#arrow-stop)':'url(#arrow)');
  p.style.animationDelay=(0.2+i*0.045)+'s';svg.appendChild(p);
  if(tone){
    const l=document.createElement('div');l.className='elbl '+tone;
    l.style.left=((pts[0].x+pts[1].x)/2)+'px';l.style.top=((pts[0].y+pts[1].y)/2)+'px';
    l.style.animationDelay=(0.4+i*0.045)+'s';world.appendChild(l);
    edgeLabels.push({el:l,tone});
  }
});

const clsFor={start:'n-term n-start',end:'n-term n-end',proc:'n-proc',act:'n-act',mode:'n-mode',stop:'n-stop',dec:'n-dec'};
let ni=0;
for(const k in NODES){
  const n=NODES[k];
  const el=document.createElement('div');
  el.className='node '+clsFor[n.kind];el.dataset.id=k;
  el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.width=n.w+'px';el.style.height=n.h+'px';
  el.style.animationDelay=(ni*0.055)+'s';ni++;
  if(n.kind==='dec'){
    el.innerHTML='<div class="inner"><span class="eye"></span><div class="ttl"></div><span class="diamark">＋</span></div>';
    n._eyeEl=el.querySelector('.eye');
  }else{
    el.innerHTML='<div class="ttl"></div>'+(n.sub?'<div class="sub"></div>':'')+'<span class="plus">＋</span>';
  }
  n._ttlEl=el.querySelector('.ttl');
  n._subEl=el.querySelector('.sub');
  el.addEventListener('click',ev=>{ev.stopPropagation();open(k,el);});
  world.appendChild(el);n._el=el;
}

const drawer=document.getElementById('drawer');
const dwBadge=document.getElementById('dwBadge'),dwTitle=document.getElementById('dwTitle'),dwBody=document.getElementById('dwBody');
let activeEl=null,activeId=null;
function fillDrawer(id){
  const n=NODES[id],d=(DETAILS[LANG][id])||{lead:''};
  const[col,bg]=BADGE_STYLE[n.kind];
  dwBadge.textContent=UI[LANG].badges[n.kind];dwBadge.style.color=col;dwBadge.style.background=bg;
  dwTitle.textContent=n.ttl[LANG];
  let html='<p class="dw-lead">'+(d.lead||'')+'</p>';
  (d.secs||[]).forEach(s=>{html+='<div class="dw-sec"><h4>'+s.h+'</h4><ul>'+s.items.map(it=>'<li>'+it+'</li>').join('')+'</ul></div>';});
  if(d.note)html+='<div class="dw-note">'+d.note+'</div>';
  dwBody.innerHTML=html;dwBody.scrollTop=0;
}
function open(id,el){
  activeId=id;fillDrawer(id);
  drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');
  if(activeEl)activeEl.classList.remove('active');
  el.classList.add('active');activeEl=el;focus(NODES[id]);
}
function closeDrawer(){
  drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');
  if(activeEl){activeEl.classList.remove('active');activeEl=null;}activeId=null;
}
document.getElementById('dwClose').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

function applyLang(){
  const u=UI[LANG];
  document.querySelectorAll('#flowLegend .lg-t').forEach((s,i)=>s.textContent=u.legend[i]);
  document.getElementById('fit').textContent=u.fit;
  document.getElementById('dwClose').textContent=u.close;
  for(const k in NODES){const n=NODES[k];
    if(n._ttlEl)n._ttlEl.textContent=n.ttl[LANG];
    if(n._subEl&&n.sub)n._subEl.textContent=n.sub[LANG];
    if(n._eyeEl)n._eyeEl.textContent=u.eyebrow;}
  edgeLabels.forEach(o=>o.el.textContent=(o.tone==='yes'?u.yes:u.no));
  if(activeId)fillDrawer(activeId);
}

const canvas=document.getElementById('canvas'),pct=document.getElementById('pct');
let scale=1,tx=0,ty=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;pct.textContent=Math.round(scale*100)+'%';}
function initialView(){
  const vw=canvas.clientWidth||window.innerWidth;
  scale=clamp(Math.min(1.05,(vw-56)/780),0.55,1.1);
  tx=vw/2-470*scale;ty=24;apply();
}
function fit(){
  const vw=canvas.clientWidth,vh=canvas.clientHeight;
  scale=clamp(Math.min(vw/W,vh/H)*0.92,0.3,1.4);
  tx=(vw-W*scale)/2;ty=(vh-H*scale)/2+4;apply();
}
function focus(n){
  const cx=n.x+n.w/2,cy=n.y+n.h/2,vw=canvas.clientWidth,vh=canvas.clientHeight;
  const rightRoom=Math.min(400,vw*0.88);
  tx=(vw-rightRoom)*0.5-cx*scale;ty=vh*0.44-cy*scale;
  world.style.transition='transform .5s cubic-bezier(.2,.7,.3,1)';apply();
  setTimeout(()=>{world.style.transition='';},520);
}
function zoomAt(ns,mx,my){ns=clamp(ns,0.3,2.4);
  const wx=(mx-tx)/scale,wy=(my-ty)/scale;scale=ns;tx=mx-wx*scale;ty=my-wy*scale;apply();}
document.getElementById('zin').onclick=()=>zoomAt(scale*1.2,canvas.clientWidth/2,canvas.clientHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(scale/1.2,canvas.clientWidth/2,canvas.clientHeight/2);
document.getElementById('fit').onclick=fit;
canvas.addEventListener('wheel',e=>{e.preventDefault();
  const r=canvas.getBoundingClientRect(),factor=e.ctrlKey?0.012:0.0016;
  zoomAt(scale*(1-e.deltaY*factor),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=false,moved=false,sx,sy,ox,oy;
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.node'))return;
  drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;
  canvas.classList.add('grabbing');canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;
  tx=ox+(e.clientX-sx);ty=oy+(e.clientY-sy);
  if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4)moved=true;apply();});
function endDrag(){if(drag&&!moved)closeDrawer();drag=false;canvas.classList.remove('grabbing');}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

applyLang();
initialView();

window.__views.flow = { setLang:function(l){ applyLang(); }, onShow:function(){ /* mantém posição atual */ } };
})();

function plate(x,y,w,h,cv,name,role,cap,capColor){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${cv.bg}" stroke="${cv.color}" stroke-width="1.5"/>
    <text x="${x+w/2}" y="${y+h/2-8}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="21" fill="${cv.color}">${name}</text>
    <text x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10.5" letter-spacing="1" fill="${cv.color}">${role.toUpperCase()}</text>
    <text x="${x+w/2}" y="${y+h/2+30}" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="${capColor}">${cap}</text>`;
}
function stackSVG(L){
  const g=id=>LAYERS.find(x=>x.id===id);
  const P=PALETTE[THEME]||PALETTE.light;
  const cap={ raw:{pt:'5 fontes → raw.*',en:'5 sources → raw.*'}, sil:{pt:'RAW → tabelas tipadas',en:'RAW → typed tables'},
              rul:{pt:'configuração → regras',en:'configuration → rules'}, gol:{pt:'Silver + Rules → modelo',en:'Silver + Rules → model'} };
  return `<svg viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="${P.wire}"/></marker>
    </defs>
    <path d="M200,116 L246,116" fill="none" stroke="${P.wire}" stroke-width="2.2" marker-end="url(#ah)"/>
    <path d="M424,108 C545,108 566,96 672,96" fill="none" stroke="${P.wire}" stroke-width="2.2" marker-end="url(#ah)"/>
    <path d="M550,176 C645,168 660,150 672,150" fill="none" stroke="${P.dash}" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
    ${plate(24,64,176,104,P.raw,g('raw').name,g('raw').role[L],cap.raw[L],P.cap)}
    ${plate(248,64,176,104,P.sil,g('silver').name,g('silver').role[L],cap.sil[L],P.cap)}
    ${plate(462,176,176,96,P.rul,g('rules').name,g('rules').role[L],cap.rul[L],P.cap)}
    ${plate(676,52,196,128,P.gol,g('gold').name,g('gold').role[L],cap.gol[L],P.cap)}
  </svg>`;
}

      tb.cols.forEach(function(c){
        const req = c.req ? '<span class="req y">'+t.req+'</span>' : '<span class="req n">'+t.opt+'</span>';
        html+='<tr><td class="c-ord">'+c.ord+'</td><td class="c-col">'+c.col+'</td>'
          +'<td class="c-type">'+c.type+'</td><td>'+req+'</td><td>'+(LANG==='en'?c.en:c.pt)+'</td></tr>';
      });
      html+='</tbody></table></div></details>';
    });
    html+='</div>';
  });
  document.getElementById('l_dictWrap').innerHTML=html;
}
const $=id=>document.getElementById('l_'+id);

function render(){
  const u=UI[LANG];
  $('uiEyebrow').textContent=u.eyebrow; $('uiTitle').textContent=u.title; $('uiLead').textContent=u.lead;

  $('stackTitle').textContent=u.stackTitle; $('stackSub').textContent=u.stackSub;
  $('stackSvg').innerHTML=stackSVG(LANG);
  $('stackNote').innerHTML=u.stackNote;

  $('mtxTitle').textContent=u.mtxTitle; $('mtxSub').textContent=u.mtxSub;
  $('cardsTitle').textContent=u.cardsTitle; $('cardsSub').textContent=u.cardsSub;
  $('closeH').textContent=u.closeH; $('closeP').textContent=u.closeP;
  renderDict();

  $('mtxHead').innerHTML=u.mtxHead.map(h=>`<th>${h}</th>`).join('');
  $('mtxBody').innerHTML=LAYERS.map(l=>`
    <tr>
      <td><div class="lay-cell" style="--lc:${l.color}"><div class="nm">${l.name}</div><div class="rl">${l.role[LANG]}</div></div></td>
      <td>${l.m.contain[LANG]}</td>
      <td>${l.m.from[LANG]}</td>
      <td><span class="pill ${l.m.load}">${l.m.loadTxt[LANG]}</span></td>
      <td>${l.m.consume[LANG]}</td>
    </tr>`).join('');

  $('layWrap').innerHTML=LAYERS.map(l=>{
    let extra='';
    if(l.isGold){
      const steps=l.cat.steps[LANG].map((s,i)=>{
        const last=i===l.cat.steps[LANG].length-1;
        return `<div class="cstep ${last?'final':''}"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${s}</div></div>`
             + (last?'':'<span class="carr">→</span>');
      }).join('');
      extra=`<div class="gold-extra">
        <div class="block"><h5>${l.cat.title[LANG]}</h5><div class="catflow">${steps}</div>
          <div class="keyint"><div class="kh"><span class="star">★</span>${l.key.title[LANG]}</div><p>${l.key.text[LANG]}</p></div>
        </div></div>`;
    }
    return `<div class="lay" style="--lc:${l.color};--lcbg:${l.bg}">
      <div class="lay-head">
        <span class="lay-name">${l.name}</span>
        <span class="role-chip">${l.role[LANG]}</span>
        <span class="lay-roleline">${l.roleLine[LANG]}</span>
      </div>
      <div class="lay-body">
        <div class="fgrid">
          <div class="fld"><h5>${u.lblContem}</h5><p>${l.contem[LANG]}</p></div>
          <div class="fld"><h5>${u.lblIO}</h5><p>${l.io[LANG]}</p></div>
          <div class="fld"><h5>${u.lblCarga}</h5><p>${l.carga[LANG]}</p></div>
          <div class="fld"><h5>${u.lblElem}</h5><p>${l.elementos[LANG]}</p></div>
        </div>
      </div>
      ${extra}
      <div class="lay-note"><b>${u.lblNote}</b>${l.atencao[LANG]}</div>
    </div>`;
  }).join('');
}

render();
window.__views.layers = { setLang:function(l){ render(); }, setTheme:function(t){ render(); } };
})();

/* ===================== CONTROLADOR GLOBAL ===================== */
(function(){
const TABS = { pt:['Fluxo do processo','Fontes de dados','Camadas do banco'],
               en:['Process flow','Data sources','Database layers'] };
const SUB  = { pt:'Documentação do processo', en:'Process documentation' };
const HINT = { pt:'<b>Clique em uma etapa</b> para ver os detalhes · arraste para mover · role para zoom',
               en:'<b>Click a step</b> to see details · drag to move · scroll to zoom' };

const hintEl = document.getElementById('uiHint');
const subEl  = document.getElementById('uiSub');

function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function applyLangGlobal(){
  document.body.classList.toggle('en', LANG==='en');
  document.documentElement.lang = LANG==='en' ? 'en' : 'pt-BR';
  subEl.textContent = SUB[LANG];
  document.querySelectorAll('#uiTabs .tab span').forEach((s,i)=>s.textContent=TABS[LANG][i]);
  hintEl.innerHTML = HINT[LANG];
  document.querySelectorAll('.flag').forEach(b=>b.classList.toggle('active', b.dataset.lang===LANG));
  for(const k in window.__views){ if(window.__views[k].setLang) window.__views[k].setLang(LANG); }
}
function setLang(l){ if(l===LANG)return; LANG=l; store('etl_lang',l); applyLangGlobal(); }

function applyTheme(){
  document.body.classList.toggle('dark', THEME==='dark');
  for(const k in window.__views){ if(window.__views[k].setTheme) window.__views[k].setTheme(THEME); }
}
function setTheme(t){ THEME=t; store('etl_theme',t); applyTheme(); }

function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.dataset.view===name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===name));
  document.body.classList.toggle('flow', name==='flow');
  hintEl.style.display = name==='flow' ? '' : 'none';
  window.scrollTo(0,0);
  if(name==='flow' && window.__views.flow && window.__views.flow.onShow) window.__views.flow.onShow();
}

/* wiring */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
document.querySelectorAll('.flag').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.getElementById('themeBtn').addEventListener('click',()=>setTheme(THEME==='dark'?'light':'dark'));

/* estado inicial */
const savedLang = load('etl_lang');
if(savedLang==='pt'||savedLang==='en') LANG=savedLang;
const savedTheme = load('etl_theme');
if(savedTheme==='light'||savedTheme==='dark'){ THEME=savedTheme; }
else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){ THEME='dark'; }

applyTheme();
applyLangGlobal();
switchView('flow');
})();
</script>
</body>
